services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./app:/var/www/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  nginx:
    image: nginx:1.29.1-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/app:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - app

  postgres:
    image: postgres:17.6-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pizza_store}
      POSTGRES_USER: ${POSTGRES_USER:-pizza_store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pizza_store}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pizza_store} -d ${POSTGRES_DB:-pizza_store}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app

volumes:
  postgres-data:

networks:
  app: