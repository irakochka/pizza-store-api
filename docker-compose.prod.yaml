services:
  php:
    build:
      target: prod
    volumes: !reset []

  nginx:
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy

  postgres:
    ports: !reset []